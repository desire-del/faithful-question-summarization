name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12: local and cluster; 3.13: current Google Colab runtime.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0  # no floating major tag published
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install (core + dev, no GPU stack)
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest

  smoke:
    # Tiny-model end-to-end pipeline on CPU: SFT -> generation -> scoring.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0  # no floating major tag published
        with:
          python-version: "3.12"
      - name: Install with CPU-only torch
        run: |
          uv venv
          uv pip install --torch-backend=cpu -e ".[train,eval]" pytest
      - name: Smoke test
        run: .venv/bin/pytest -m smoke

